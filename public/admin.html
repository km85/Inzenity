  <div class="dashboard-shell">
    <aside class="sidebar" id="adminSidebar" aria-label="Administration">
      <div class="brandmark"><img src="/admin-v2/club-mark.webp" alt="INZENITY Innova Zenix Community"></div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Management modules"></nav>
      <div class="sidebar-actions">
        <details><summary><svg class="ico" aria-hidden="true"><use href="#ico-settings"></use></svg> Administration</summary>
        <a class="sidebar-button" href="/">Open member app</a>

        <button class="sidebar-button" id="adminLogoutButton" type="button">Log out</button></details>
      </div>
      <img class="sidebar-art" src="/admin-v2/anniversary-art.webp" alt="">
    </aside>
    <button id="drawerShade" hidden aria-label="Close navigation"></button>
    <main class="dashboard-main">
      <header class="v2bar">
        <button id="navToggle" type="button" aria-controls="adminSidebar" aria-expanded="true" aria-label="Toggle navigation"><svg class="ico" aria-hidden="true"><use href="#ico-menu"></use></svg></button>
        <span class="app-title"><b>INZENITY</b> Admin Panel</span>
        <div class="operator"><svg class="ico" aria-hidden="true"><use href="#ico-circle-user"></use></svg><span><strong id="adminUserName"></strong><small id="adminUserMeta"></small></span></div>
      </header>
      <div class="workspace">
        <p id="apiProgress" role="status">Connecting to INZENITY…</p>
        <div id="apiNotice" role="alert" hidden><span></span><button id="reloadRecords" type="button" class="ghost-button">Reload dashboard</button></div>
        <div id="heroBanner"><img src="/admin-v2/anniversary-banner.webp" alt="INZENITY Innova Zenix Community, second anniversary"></div>
        <header class="dashboard-header"><div><div class="eyebrow" id="pageEyebrow">Administration</div><h1 id="pageTitle">Dashboard</h1><p class="muted" id="pageDescription"></p></div></header>
        <section class="overview-grid" id="stats" aria-label="Club totals"></section>
        <section id="tableArea" aria-label="Administration workspace"></section>
      </div>
    </main>
  </div>
  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="recordModal" class="record-modal hidden" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="record-modal-card">
      <div class="table-heading">
        <div>
          <div class="eyebrow">Editor</div>
          <h3 id="formTitle">New Record</h3>
        </div>
        <button class="ghost-button" id="closeModalButton" type="button">Close</button>
      </div>
      <form id="recordForm"></form>
    </div>
  </div>
  <div id="qrModal" class="record-modal hidden" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="record-modal-card">
      <div class="table-heading">
        <div>
          <div class="eyebrow">Check-In QR</div>
          <h3 id="qrTitle">Event QR</h3>
        </div>
        <button class="ghost-button" id="closeQrModalButton" type="button">Close</button>
      </div>
      <div id="qrContainer" style="text-align:center; padding: 20px 0;">
        <img id="qrImage" src="" alt="QR Code" style="max-width: 300px; margin-bottom: 16px;">
        <p class="muted" id="qrToken"></p>
      </div>
    </div>
  </div>

  <script src="/admin-v2/qrcode.js"></script>
  <script src="/i18n.js"></script>
  <script src="/admin-v2/dashboard.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
