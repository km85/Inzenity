<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Innova Zenix Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">Member Login</div>
      <h1>Innova Zenix Community</h1>
      <p class="muted">Sign in with your member account to enter the club app.</p>
      <div class="landing-panel">
        <div class="landing-item">
          <strong>Demo Member</strong>
          <span>raka / member123</span>
        </div>
        <div class="landing-item">
          <strong>Alternative</strong>
          <span>dina / member123</span>
        </div>
        <div class="landing-item">
          <strong>Admin</strong>
          <span><a href="/admin.html">Open dashboard login</a></span>
        </div>
      </div>
      <div class="demo-strip">
        <button class="pill" type="button" data-demo-username="raka" data-demo-password="member123">Raka</button>
        <button class="pill" type="button" data-demo-username="dina" data-demo-password="member123">Dina</button>
        <button class="pill" type="button" data-demo-username="bimo" data-demo-password="member123">Bimo</button>
      </div>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" name="username" type="text" placeholder="raka" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" placeholder="member123" required>
        </div>
        <button class="primary-button" type="submit">Enter Community App</button>
      </form>
    </div>
  </div>

  <div id="appView" class="member-shell hidden">
    <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>

    <aside id="sideDrawer" class="side-drawer hidden">
      <div class="drawer-top">
        <div class="avatar-circle" id="drawerAvatar">R</div>
        <div>
          <strong id="drawerName">Raka Pratama</strong>
          <p id="drawerUsername" class="muted">@raka</p>
        </div>
      </div>
      <nav class="drawer-menu">
        <button class="drawer-link" type="button" data-drawer-target="my-zenix">
          <span><span class="icon">🚙</span> My Zenix</span>
        </button>
        <button class="drawer-link" type="button" data-drawer-target="events">
          <span><span class="icon">📅</span> Events</span>
        </button>
        <button class="drawer-link" type="button" data-drawer-target="vendors">
          <span><span class="icon">🛠</span> Vendors</span>
        </button>
        <button class="drawer-link" type="button" data-drawer-target="merchandise">
          <span><span class="icon">🛒</span> Merchandise</span>
        </button>
        <button class="drawer-link theme-toggle" id="themeToggle" type="button">
          <span><span class="icon" id="themeIcon">🌙</span> <span id="themeLabel">Dark mode</span></span>
        </button>
        <button class="drawer-link danger-link" id="drawerLogoutButton" type="button">
          <span><span class="icon">↪</span> Logout</span>
        </button>
      </nav>
    </aside>

    <header class="member-header">
      <button id="menuButton" class="icon-button" type="button" aria-label="Open menu">☰</button>
      <div class="member-header-copy">
        <p class="header-kicker">Welcome back</p>
        <h1 id="greetingName">Raka</h1>
      </div>
      <a href="#home" class="brand-chip" aria-label="Home">IZ</a>
    </header>

    <main class="member-main">
      <section id="screen-home" class="screen"></section>
      <section id="screen-my-zenix" class="screen hidden"></section>
      <section id="screen-events" class="screen hidden"></section>
      <section id="screen-event-detail" class="screen hidden"></section>
      <section id="screen-vendors" class="screen hidden"></section>
      <section id="screen-merchandise" class="screen hidden"></section>
      <section id="screen-sponsor-detail" class="screen hidden"></section>
      <section id="screen-merch-detail" class="screen hidden"></section>
    </main>

    <nav class="member-bottom-nav">
      <a href="#home" class="member-nav-link" data-screen="home">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="#events" class="member-nav-link" data-screen="events">
        <span class="nav-icon">📅</span>
        <span>Events</span>
      </a>
      <a href="#vendors" class="member-nav-link" data-screen="vendors">
        <span class="nav-icon">🛠</span>
        <span>Vendors</span>
      </a>
      <a href="#merchandise" class="member-nav-link" data-screen="merchandise">
        <span class="nav-icon">🛒</span>
        <span>Merch</span>
      </a>
      <a href="#my-zenix" class="member-nav-link" data-screen="my-zenix">
        <span class="nav-icon">🚙</span>
        <span>My Zenix</span>
      </a>
    </nav>
  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
